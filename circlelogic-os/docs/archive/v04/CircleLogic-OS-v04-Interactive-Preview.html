async function loadSession(){const session=await api('/auth/session');S.session=session;S.csrf=session.csrf||'';S.environment=session.environment||'development';S.lastVerified=session.mfa_recent?Date.now():0;
 if(session.authenticated&&session.stage==='full'){S.user=session.user;S.auth='login';S.enrolment=null;return render();}
 S.user=null;S.auth=session.stage==='enrol'?'enrol':session.stage==='mfa'?'mfa':'login';return renderAuth();}
function ensureRecent(action){if(S.preview||Date.now()-S.lastVerified<9*60*1000)return action();
 S.pending=action;modal('Reverify your identity',`<p class="intro">Before changing credentials, enter a fresh authenticator code or an unused recovery code.</p><form id="stepup-form">${field('stepup','Authentication code','text','','autocomplete="one-time-code" maxlength="50"')}<button class="btn primary full" type="submit">Verify identity</button></form>`);
}
function openConnect(id){const c=S.connections.find(c=>c.id===id);if(!c)return;
 if(!c.manageable){modal('Workspace access',`<p class="intro">Your role cannot manage this connection. Ask your workspace owner for access. Private calendars are never shared between accounts.</p>`);return;}

function connectionDialog(c){
 const prefix=`<div class="modal-provider">${providerIcon(c.id)}<div><h3>${esc(c.name)}</h3><p>${c.private?'Private to your login':'Shared only within your agency workspace'}</p></div></div>`;

 const security=S.preview?'Real credentials are disabled in this design preview. Use the sample button to preview a connection state.':location.protocol==='https:'?'Credentials are encrypted on the backend. This connection requires your current two-factor-authenticated session.':'Local development: credentials are encrypted at rest. Use approved HTTPS hosting before entering client secrets.';
 if(c.has_credentials&&!S.preview){
  modal('Manage '+c.name,prefix+`<div class="info-banner">${icon('lock',18)}<span>Saved secrets are never sent back to this browser.</span></div><div class="connection-status-line">${statusMarkup(c.status)}<span class="muted small">${esc(relative(c.last_success))}</span></div>${c.error?'<div class="error-box">'+esc(c.error)+'</div>':''}<p class="intro">${c.auth==='oauth'?'Authorise Microsoft, then sync your calendar.':'Sync the approved REA listing reports to update your dashboard.'} Saving credentials alone does not create a live connection.</p><div class="form-actions">${c.auth==='oauth'?`<button class="btn" data-action="authorise" data-provider="${c.id}">Authorise Microsoft ${icon('external',12)}</button>`:''}<button class="btn primary" data-action="sync" data-provider="${c.id}" ${c.auth==='oauth'&&c.status==='configured'?'disabled':''}>${icon('refresh',14)}Sync now</button></div><div class="form-actions" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:17px"><button class="text-btn" data-action="replace-credentials" data-provider="${c.id}">Replace credentials</button><button class="text-btn" style="color:var(--red)" data-action="disconnect" data-provider="${c.id}">Disconnect and erase local data</button></div>`);return;
 }
 credentialForm(c,prefix,security);
}
function credentialForm(c,prefix='',security='Credentials are encrypted on the backend and scoped to this workspace.'){

 const fields=c.fields.map(f=>field(f.key,f.label,f.secret?'password':'text','',`autocomplete="off" spellcheck="false" autocapitalize="none" maxlength="16000" ${disabled} placeholder="${S.preview?'Disabled in design preview':'Enter '+esc(f.label.toLowerCase())}"`)).join('');
 const template=Object.fromEntries(c.fields.map(f=>[f.key,'']));
 modal('Secure API connection',prefix+`<div class="info-banner">${icon('lock',18)}<span>${esc(security)}</span></div><form id="credential-form" data-provider="${c.id}">${fields}
 ${c.callback?`<div class="field"><label for="redirect-uri">Web redirect URI</label><input id="redirect-uri" readonly value="${esc(c.callback)}"><small>Register this exact Web redirect in Microsoft Entra before authorising.</small></div>`:''}
 <div class="upload-box"><label for="credential-file">${icon('file',16)}Or upload a credential JSON file</label><input id="credential-file" type="file" accept=".json,application/json" data-provider="${c.id}" ${disabled}><small>Maximum 16 KB. A flat JSON object with exactly the fields above. This fills the form; it does not automatically save or connect.</small></div>
 <details class="inline-details"><summary>View JSON format</summary><pre class="template">${safeJson(template)}</pre><button type="button" class="text-btn" data-action="template" data-provider="${c.id}">${icon('download',13)}Download blank template</button></details>
 <div class="modal-warning">${icon('info',14)}<span>Use only approved integration credentials, never your normal vendor login password. Do not paste keys into chat.</span></div><div class="form-actions"><button type="button" class="btn" data-action="guide" data-provider="${c.id}">Setup guide</button>${S.preview?'<button type="button" class="btn primary" data-action="preview-example">Show example dashboard</button>':'<button type="submit" class="btn primary">Save credentials '+icon('lock',13)+'</button>'}</div></form>`);
}

}
function openRecord(panel,index){const r=S.data?.[panel]?.rows?.[Number(index)];if(!r)return;

 else if(S.example&&panel==='buyer_activity'){body+=`<div class="detail-row"><span>Example score</span><strong>${esc(r.score)} / 100</strong></div><div class="info-banner neutral" style="margin-top:19px">${icon('info',18)}<span>This score is illustrative. The real application does not calculate or import this score from listing-performance metrics.</span></div>`;}
 else body+=`<details class="inline-details" open><summary>Imported fields</summary><pre class="template">${safeJson(r)}</pre></details>`;
 modal(S.example?'Example record':'Imported record',body);
}

 modal('Account security',`<div class="modal-provider"><span class="metric-icon">${icon('shield',20)}</span><div><h3>${esc(S.user.username)}</h3><p>${esc(S.user.agency)} &middot; ${esc(S.user.role)}</p></div></div><div class="info-banner">${icon('lock',17)}<span>Two-factor authentication is enabled. Workspace access is determined on the server, not by a browser-selected instance.</span></div><form id="account-stepup-form">${field('verify','Fresh authenticator or recovery code','text','','maxlength="50" autocomplete="one-time-code"')}<button class="btn" type="submit">Reverify identity</button></form><details class="inline-details"><summary>Change password</summary><form id="password-form" style="margin-top:18px">${field('old_password','Current password','password','','autocomplete="current-password"')}${field('new_password','New password','password','At least 12 characters. Other sessions will be signed out.','minlength="12" maxlength="256" autocomplete="new-password"')}<button class="btn primary" type="submit">Update password</button></form></details><div class="form-actions"><button class="btn" data-action="revoke-sessions">Sign out other sessions</button><button class="btn" data-action="logout">Sign out</button></div>`);
}
async function refreshData(button){
 if(S.preview){await render();toast('Preview refreshed. No provider requests were made.');return;}
 const ready=S.connections.filter(c=>c.has_credentials&&c.implemented&&(c.auth!=='oauth'||c.status!=='configured'));
 if(!ready.length){toast('No sources are ready to sync. Open API Connections to get started.');return;}
 ensureRecent(async()=>{button?.classList.add('spin');if(button)button.disabled=true;let failures=[];
 try{for(const c of ready){try{await api('/integrations/'+c.id+'/sync','POST');}catch(e){failures.push(SHORT[c.id]+': '+e.message);}}await render();toast(failures.length?failures.join(' '):'The connected snapshots have been refreshed.',!!failures.length);}
 finally{if(button?.isConnected){button.disabled=false;button.classList.remove('spin');}}
 });
}
function download(name,text){const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function action(name,button){
 const id=button?.dataset.provider;
 if(name==='close-modal')return closeModal();
 if(name==='show-secret'){const el=document.getElementById(button.dataset.target);if(el){el.type=el.type==='password'?'text':'password';button.setAttribute('aria-label',(el.type==='password'?'Show':'Hide')+' secret');}return;}
 if(name==='guide')return guide(id||'agentbox');
 if(name==='guide-to-connect'){closeModal();return openConnect(id);}
 if(name==='toggle-menu'){const el=$('.sidebar');el.classList.toggle('open');button.setAttribute('aria-expanded',String(el.classList.contains('open')));return;}
 if(name==='access-help')return modal('Get access to your workspace',`<p class="intro">Ask your CircleLogic administrator to provision your account in the correct workspace. Each person should use their own login and authenticator.</p><div class="info-banner neutral">${icon('info',18)}<span>The known testing account is for local development only. Customer workspaces are created separately by an operator.</span></div>`);
 if(name==='logout'){try{await api('/auth/logout','POST');}catch(e){if(e.status!==401&&!S.preview)toast(e.message,true);}S.user=null;S.data=null;S.csrf='';S.auth='login';S.enrolment=null;S.recoveries=[];S.connections=[];closeModal();location.hash='';return renderAuth();}
 if(name==='security')return account();
 if(name==='connection-health')return health();
 if(name==='reload')return render();
 if(name==='refresh')return refreshData(button);
 if(name==='preview-example'||name==='preview-empty'){if(!S.preview)return;window.previewState.example=name==='preview-example';S.example=window.previewState.example;closeModal();S.route='dashboard';location.hash='dashboard';return render();}
 if(name==='copy-recoveries'){try{await navigator.clipboard.writeText(S.recoveries.join('\n'));toast('Recovery codes copied. Save them in a private password manager.');}catch{toast('Clipboard access is unavailable. Select and copy the displayed codes manually.',true);}return;}
 if(name==='metric-info'){const m=S.data.metrics.find(m=>m.id===button.dataset.id);if(!m)return;return modal(m.title,`<p class="intro">${esc(m.description)}</p><div class="detail-row"><span>Source</span><strong>${esc(TITLES[m.provider])}</strong></div><div class="detail-row"><span>Current state</span><strong>${S.example?'Illustrative example only':m.value===null?'No approved data imported':m.mode==='stale'?'Stale snapshot':'Imported snapshot'}</strong></div><div class="form-actions"><button class="btn primary" data-action="guide-to-connect" data-provider="${m.provider}">Manage source</button></div>`);}
 if(name==='panel-info')return guide('rea');
 if(name==='record')return openRecord(button.dataset.panel,button.dataset.index);
 if(name==='template'){const c=S.connections.find(c=>c.id===id);if(c)return download(`circlelogic-${id}-credentials.json`,JSON.stringify(Object.fromEntries(c.fields.map(f=>[f.key,''])),null,2));return;}
 if(name==='replace-credentials'){const c=S.connections.find(c=>c.id===id);if(c)return ensureRecent(()=>credentialForm(c));return;}
 if(name==='authorise'){return ensureRecent(async()=>{try{const result=await api('/integrations/'+id+'/authorise','POST');const u=new URL(result.url);if(u.protocol!=='https:'||u.hostname!=='login.microsoftonline.com')throw Error('An unexpected authorisation address was rejected.');location.assign(result.url);}catch(e){formError($('.modal-body'),e);}});}
 if(name==='sync'){return ensureRecent(async()=>{button.disabled=true;button.classList.add('spin');try{await api('/integrations/'+id+'/sync','POST');closeModal();await render();toast('Import completed. The dashboard now shows the returned data.');}catch(e){await reloadConnections();formError($('.modal-body')||$('#page'),e);}finally{if(button.isConnected){button.disabled=false;button.classList.remove('spin');}}});}
 if(name==='disconnect'){return modal('Disconnect '+SHORT[id]+'?',`<p class="intro">This erases the saved credentials and imported records for this connection. It does not delete records in the provider system. Revoke the integration in the provider account as well.</p><div class="form-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn danger" data-action="confirm-disconnect" data-provider="${id}">Disconnect and erase</button></div>`);}
 if(name==='confirm-disconnect'){return ensureRecent(async()=>{try{await api('/integrations/'+id,'DELETE');closeModal();await render();toast('Connection removed. Revoke provider consent separately.');}catch(e){formError($('.modal-body'),e);}});}
 if(name==='revoke-sessions'){return ensureRecent(async()=>{try{await api('/auth/revoke-other-sessions','POST');toast('Other active sessions have been signed out.');}catch(e){formError($('.modal-body'),e);}});}
}
async function reloadConnections(){S.connections=(await api('/brain/connections')).connections;}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}const connect=e.target.closest('[data-connect]');if(connect){openConnect(connect.dataset.connect);return;}const b=e.target.closest('[data-action]');if(b)Promise.resolve(action(b.dataset.action,b)).catch(error=>toast(error.message,true));});
document.addEventListener('change',async e=>{
 if(e.target.id==='calendar-window'){S.days=Number(e.target.value);if(S.data)$('#page').innerHTML=dashboardPage(S.data);return;}
 if(e.target.id!=='credential-file')return;
 const form=e.target.closest('form'),c=S.connections.find(c=>c.id===e.target.dataset.provider);const file=e.target.files?.[0];if(!file)return;
 try{if(S.preview)throw Error('Real credentials are disabled in this preview.');if(file.size>16384)throw Error('Choose a JSON file smaller than 16 KB.');let values;try{values=JSON.parse(await file.text());}catch{throw Error('The file is not valid JSON. Use the blank template.');}
 const keys=c.fields.map(f=>f.key);if(!values||Array.isArray(values)||typeof values!=='object'||Object.keys(values).length!==keys.length||!keys.every(k=>Object.hasOwn(values,k)&&typeof values[k]==='string'&&values[k].trim()))throw Error('Use a flat object with exactly these non-empty text fields: '+keys.join(', '));
 for(const key of keys)form.elements[key].value=values[key];$('.error-box',form)?.remove();toast('Fields filled from JSON. Review them, then save credentials.');
 }catch(error){formError(form,error);}finally{e.target.value='';}
});

 try{
  if(form.id==='login-form'){const r=await api('/auth/login','POST',{username:data.username,password:data.password});form.reset();S.csrf=r.csrf;S.auth=r.stage;S.enrolment=null;renderAuth();}
  else if(form.id==='mfa-form'){const r=await api('/auth/mfa','POST',{code:String(data.code).trim()});form.reset();S.csrf=r.csrf;S.lastVerified=Date.now();S.enrolment=null;S.recoveries=r.recovery_codes||[];if(S.recoveries.length)renderAuth();else await loadSession();}
  else if(form.id==='recovery-form'){S.recoveries=[];await loadSession();}
  else if(form.id==='credential-form'){if(S.preview)throw Error('Preview credentials are disabled.');const provider=form.dataset.provider;const c=S.connections.find(c=>c.id===provider);const values=Object.fromEntries(c.fields.map(f=>[f.key,data[f.key]]));await api('/integrations/'+provider,'PUT',{values});form.reset();await reloadConnections();closeModal();await render();const updated=S.connections.find(c=>c.id===provider);connectionDialog(updated);toast('Credentials saved. '+(c.auth==='oauth'?'Authorise Microsoft, then sync.':'Select Sync now to import data.'));}
  else if(form.id==='stepup-form'){await api('/auth/step-up','POST',{code:data.stepup});const next=S.pending;S.lastVerified=Date.now();closeModal();if(next)await next();}
  else if(form.id==='account-stepup-form'){await api('/auth/step-up','POST',{code:data.verify});S.lastVerified=Date.now();form.reset();toast('Identity verified for sensitive changes.');}
  else if(form.id==='password-form'){await api('/auth/password','POST',{old_password:data.old_password,new_password:data.new_password});form.reset();toast('Password updated. Other sessions were signed out.');}
 }catch(error){formError(form,error);if(error.status===403&&error.message.toLowerCase().includes('reverify')){S.lastVerified=0;toast('Open Account security to reverify your identity, then retry.',true);}}
 finally{if(submit?.isConnected)submit.disabled=false;}
});
window.addEventListener('hashchange',()=>{if(S.user)render();});
window.addEventListener('pageshow',e=>{if(e.persisted&&!S.preview)loadSession();});
(async()=>{try{await loadSession();}catch(error){renderAuth();formError($('.auth-form-wrap'),error);}})();
</script></body>
</html>
